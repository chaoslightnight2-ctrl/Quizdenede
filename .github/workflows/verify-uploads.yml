name: Verify existing YouTube uploads
on:
  workflow_run:
    workflows: ["Run Quizdenede Brain Teaser Bot"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: Existing generation run ID to verify without reupload
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: upload-receipt-audit
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install readback dependencies
        run: |
          pip install google-api-python-client google-auth requests
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Download existing generation artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run || github.event.workflow_run.id }}
        run: gh run download "$SOURCE_RUN" --dir audit-artifacts
      - name: Verify receipts and complete media
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SOURCE_RUN: ${{ inputs.source_run || github.event.workflow_run.id }}
        run: python maintenance/verify_existing_uploads.py --source-run "$SOURCE_RUN"
      - name: Preserve audit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f maintenance/latest-verification.json maintenance/previews/ 2>/dev/null || git add -f maintenance/latest-verification.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record actual upload receipts and render audit [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upload-verification
          path: maintenance/latest-verification.json
