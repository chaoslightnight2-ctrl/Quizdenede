name: Inspect real Groq text without video
'on':
  push:
    branches:
    - main
    paths:
    - .github/maintenance/text-audit-*.json
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: text-only-quality-audit
  cancel-in-progress: true
jobs:
  text:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install Python dependencies
      run: python -m pip install -r requirements.txt
    - name: Generate real Groq text only
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GROQ_MODEL: openai/gpt-oss-120b
        PEXELS_API_KEY: text_audit_no_visual_requests
        YOUTUBE_REFRESH_TOKEN: text_audit_upload_disabled
        ENABLE_YOUTUBE_UPLOAD: '0'
        DRY_RUN: '1'
        PUBLISH_UPLOAD_CHECKPOINTS: '0'
        TZ: Europe/Istanbul
      run: python maintenance/text_only_audit.py quiz
    - name: Save text evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: real-groq-text-audit
        path: text-audit/
        retention-days: 7
