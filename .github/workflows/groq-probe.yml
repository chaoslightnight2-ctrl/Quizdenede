name: Groq same-model schema healthcheck
on:
  push:
    branches: [main]
    paths: [".github/maintenance/probe-*.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Verify same Groq model and mandatory output fields
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python maintenance/groq_probe.py
      - name: Save provider diagnostic
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance/groq-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record same-model provider diagnostic [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
