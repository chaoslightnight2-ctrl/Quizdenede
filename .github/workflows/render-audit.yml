name: Render one new video for quality inspection
'on':
  push:
    branches:
    - main
    paths:
    - .github/maintenance/audit-*.json
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: one-video-quality-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install system dependencies
      run: "sudo apt-get update\nsudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core\
        \ fontconfig\nsudo fc-cache -fv\n\nfor f in /etc/ImageMagick-6/policy.xml\
        \ /etc/ImageMagick-7/policy.xml; do\n  if [ -f \"$f\" ]; then\n    sudo sed\
        \ -i 's#rights=\"none\" pattern=\"@\\*\"#rights=\"read|write\" pattern=\"\
        @*\"#' \"$f\" || true\n    sudo sed -i 's#<policy domain=\"path\" rights=\"\
        none\" pattern=\"@\\*\"/>#<policy domain=\"path\" rights=\"read|write\" pattern=\"\
        @*\"/>#' \"$f\" || true\n    sudo sed -i 's#<policy domain=\"path\" rights=\"\
        none\" pattern=\"@\\*\" />#<policy domain=\"path\" rights=\"read|write\" pattern=\"\
        @*\" />#' \"$f\" || true\n  fi\ndone\n\nwhich convert || true\nconvert -version\
        \ || true\nfc-match \"DejaVu Sans Bold\" || true\n"
    - name: ImageMagick text healthcheck
      run: 'convert -background none -fill yellow -stroke black -strokewidth 3 -font
        "DejaVu-Sans-Bold" -pointsize 64 label:''TEST TÜRKÇE İĞÜŞÖÇ'' PNG32:/tmp/im_text_test.png

        test -s /tmp/im_text_test.png

        ls -lh /tmp/im_text_test.png

        '
    - name: Install Python dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        python -m pip install --upgrade edge-tts

        python -m pip show edge-tts

        '
    - name: Quality regression checks
      run: python -m unittest test_quality_regressions.py
    - name: Check Edge TTS before rendering
      env:
        VOICE: tr-TR-AhmetNeural
        VOICE_RATE: +0%
        VOICE_PITCH: -2Hz
      run: python edge_tts_healthcheck.py
    - name: Render one real Groq sample without YouTube upload
      env:
        TZ: Europe/Istanbul
        GROQ_MODEL: openai/gpt-oss-120b
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        YOUTUBE_REFRESH_TOKEN: audit_upload_disabled
        DRY_RUN: '1'
        ENABLE_YOUTUBE_UPLOAD: '0'
        PUBLISH_UPLOAD_CHECKPOINTS: '0'
        VOICE: tr-TR-AhmetNeural
        VOICE_RATE: +0%
        VOICE_PITCH: -2Hz
        IMAGEMAGICK_BINARY: /usr/bin/convert
        SUBTITLE_FONT: DejaVu-Sans-Bold
      run: 'python -m pip install Pillow

        python maintenance/render_one_audit.py quiz'
    - name: Upload video and inspection evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: one-video-quality-audit
        path: 'quality-audit/

          bot.log'
        retention-days: 7
        if-no-files-found: warn
