name: Groq API smoke test (no video upload)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groq-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install OpenAI-compatible client
        run: python -m pip install --quiet openai
      - name: Call Groq chat completions with production client
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: |
          python - <<'PY'
          import os
          from openai import OpenAI

          client = OpenAI(
              api_key=os.environ["GROQ_API_KEY"],
              base_url="https://api.groq.com/openai/v1",
          )
          try:
              response = client.chat.completions.create(
                  model=os.environ["GROQ_MODEL"],
                  messages=[{"role": "user", "content": "Reply with exactly GROQ_OK"}],
                  max_tokens=12,
                  reasoning_effort="low",
              )
          except Exception as exc:
              print(f"Groq request failed: {type(exc).__name__}: {exc}")
              raise SystemExit(1)

          text = (response.choices[0].message.content or "").strip()
          if not text:
              raise SystemExit("Groq returned an empty completion")
          print(f"Groq OK; model={response.model}; response_chars={len(text)}")
          PY
